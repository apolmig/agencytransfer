name: FronteraEval build and deploy

on:
  push:
    branches:
      - agent/fronteraeval-v0
    paths:
      - "fronteraeval/**"
      - ".github/workflows/fronteraeval-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fronteraeval-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fronteraeval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fronteraeval/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and validate catalogue
        run: npm run build && npm run check
