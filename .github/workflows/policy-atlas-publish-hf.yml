name: Publish Policy Atlas to Hugging Face

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type publish-v0.2.0-beta.1 to publish this exact research preview"
        required: true
        type: string
      expected_sha:
        description: "Paste the full reviewed main commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm == 'publish-v0.2.0-beta.1' && github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha }}
    runs-on: ubuntu-latest
    environment: policy-atlas-release
    concurrency:
      group: policy-atlas-hugging-face
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Set up locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: policy-atlas/package-lock.json
      - name: Verify the frozen Python environment
        run: |
          uv lock --check
          uv sync --frozen --group dev
      - name: Verify the immutable Git source tag
        run: |
          tag_commit="$(git rev-parse 'refs/tags/v0.2.0-beta.1^{commit}')"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Git tag v0.2.0-beta.1 does not point to the reviewed main commit"
            exit 1
          fi
      - name: Build and stage the research preview without release credentials
        run: |
          uv run --frozen ruff check policy-atlas/scripts policy-atlas/tests
          uv run --frozen ruff format --check policy-atlas/scripts policy-atlas/tests
          uv run --frozen python policy-atlas/scripts/build_release.py
          uv run --frozen python policy-atlas/scripts/validate_release.py
          npm ci --prefix policy-atlas
          npm --prefix policy-atlas run build:parquet
          uv run --frozen python policy-atlas/scripts/validate_release.py
          git status --porcelain=v1 --untracked-files=all -- policy-atlas/release > /tmp/policy-atlas-release-status
          if [ -s /tmp/policy-atlas-release-status ]; then
            cat /tmp/policy-atlas-release-status
            echo "Generated release differs from committed release inventory"
            exit 1
          fi
          uv run --frozen python -m unittest discover -s policy-atlas/tests -p 'test_*.py'
          git status --porcelain=v1 --untracked-files=all -- policy-atlas/release > /tmp/policy-atlas-release-status
          if [ -s /tmp/policy-atlas-release-status ]; then
            cat /tmp/policy-atlas-release-status
            echo "Tests left release bytes different from the committed inventory"
            exit 1
          fi
          uv run --frozen python policy-atlas/scripts/prepare_hf_release.py
      - name: Upload the validated staged release
        run: uv run --frozen python policy-atlas/scripts/publish_hf.py
        env:
          # A fine-grained environment secret scoped only to the Policy Atlas
          # dataset. Do not reuse the benchmark publisher's token.
          HF_TOKEN: ${{ secrets.POLICY_ATLAS_HF_TOKEN }}
