name: One-shot refine APE120 live inventory v0.3

on:
  push:
    branches:
      - agent/ape120-longitudinal-20260825
    paths:
      - .github/workflows/one-shot-ape120-inventory-v03.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ape120-longitudinal-20260825
          fetch-depth: 1
          persist-credentials: true

      - name: Refine scope, route, parameter, and budget rules
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/fix_refine_ape120_inventory_v03.py
          python scripts/fix_refine_ape120_inventory_v03.py
          python -m py_compile scripts/refine_ape120_inventory_v03.py
          python scripts/refine_ape120_inventory_v03.py
          python -m py_compile scripts/build_ape120_inventory.py
          python scripts/build_ape120_inventory.py

      - name: Validate longitudinal coverage and budget
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('evals/research-notes/ape120-live-inventory-20260825.json')
              .read_text(encoding='utf-8')
          )
          selected = report['selected_model_ids']
          assert report['selected_count'] == len(selected)
          assert report['selected_count'] >= 12
          assert report['expected_selected_target_cost_usd'] <= 23.5
          assert any(model.startswith('openai/gpt-') for model in selected)
          assert any(model.startswith('anthropic/claude-') for model in selected)
          assert any(model.startswith('google/gemini-') for model in selected)
          assert any(model.startswith('x-ai/grok-') for model in selected)
          assert not any('lite' in model or 'safeguard' in model for model in selected)
          for row in report['rows']:
              if row.get('selected_for_budget') and row.get('hugging_face_id'):
                  assert row.get('total_params_b') is not None
                  assert float(row['total_params_b']) >= 100
          PY
          rm .github/workflows/one-shot-ape120-inventory-v03.yml
          rm scripts/refine_ape120_inventory_v03.py
          rm scripts/fix_refine_ape120_inventory_v03.py

      - name: Commit refined inventory
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/one-shot-ape120-inventory-v03.yml
          test ! -e scripts/refine_ape120_inventory_v03.py
          test ! -e scripts/fix_refine_ape120_inventory_v03.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/one-shot-ape120-inventory-v03.yml \
            scripts/refine_ape120_inventory_v03.py \
            scripts/fix_refine_ape120_inventory_v03.py \
            scripts/build_ape120_inventory.py \
            evals/research-notes/ape120-live-inventory-20260825.json \
            evals/research-notes/ape120-live-inventory-20260825.csv
          git commit -m 'Refine APE120 longitudinal checkpoint inventory'
          git push origin HEAD:agent/ape120-longitudinal-20260825
