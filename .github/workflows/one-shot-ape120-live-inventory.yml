name: One-shot APE120 live OpenRouter inventory

on:
  push:
    branches:
      - agent/ape120-longitudinal-20260825
    paths:
      - .github/workflows/one-shot-ape120-live-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ape120-longitudinal-20260825
          fetch-depth: 1
          persist-credentials: true

      - name: Capture current eligible checkpoints and routes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_ape120_inventory.py
          python scripts/build_ape120_inventory.py
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('evals/research-notes/ape120-live-inventory-20260825.json')
              .read_text(encoding='utf-8')
          )
          assert report['candidate_count'] > 0
          assert report['selected_count'] > 0
          assert report['expected_selected_target_cost_usd'] <= 25.0
          assert len(report['selected_model_ids']) == report['selected_count']
          PY
          rm .github/workflows/one-shot-ape120-live-inventory.yml

      - name: Commit sanitised inventory
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/one-shot-ape120-live-inventory.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/one-shot-ape120-live-inventory.yml \
            evals/research-notes/ape120-live-inventory-20260825.json \
            evals/research-notes/ape120-live-inventory-20260825.csv
          git commit -m 'Capture live APE120 longitudinal OpenRouter inventory'
          git push origin HEAD:agent/ape120-longitudinal-20260825
