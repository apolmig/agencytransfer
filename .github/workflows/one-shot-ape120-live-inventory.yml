name: One-shot APE120 live OpenRouter inventory

on:
  push:
    branches:
      - agent/ape120-longitudinal-20260825
    paths:
      - .github/workflows/one-shot-ape120-live-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ape120-longitudinal-20260825
          fetch-depth: 1
          persist-credentials: true

      - name: Capture current eligible checkpoints and routes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/inventory.py"
          python "$RUNNER_TEMP/inventory.py"

      - name: Commit sanitised inventory
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/one-shot-ape120-live-inventory.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/one-shot-ape120-live-inventory.yml \
            evals/research-notes/ape120-live-inventory-20260825.json \
            evals/research-notes/ape120-live-inventory-20260825.csv
          git commit -m 'Capture live APE120 longitudinal OpenRouter inventory'
          git push origin HEAD:agent/ape120-longitudinal-20260825
