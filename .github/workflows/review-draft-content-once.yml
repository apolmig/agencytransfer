name: Review draft status and four research parts
on:
  push:
    branches: [draft-humility-four-parts-20260901]
    paths: [.github/workflows/review-draft-content-once.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: draft-humility-four-parts-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply only the reviewed content changes
        run: |
          python - <<'PY'
          import hashlib, html, pathlib, re
          root = pathlib.Path('.')
          def edit(name, replacements):
              path = root / name
              text = path.read_text()
              for old, new in replacements:
                  assert text.count(old) == 1, (name, 'anchor count', text.count(old), old[:100])
                  text = text.replace(old, new)
              path.write_text(text.rstrip()+'\n')
          edit('src/editorial/ProgrammePages.tsx', [
            ('import { MechanismStrip } from "./EditorialVisuals";', 'import { MechanismStrip } from "./EditorialVisuals";\nimport { BudgetBoundary } from "../components/ResearchStatus";'),
            ('title: "Operations",', 'title: "Capability and operations",'),
            ('line: "Access is not control.",', 'line: "How far can an adversarial actor go with $10?",'),
            ('body: "What a served system can produce, what an operator can operationalise, and where the chain stopped.",', 'body: "Pretty far, actually—for exploratory planning and synthetic prototypes. An author-reported service budget, not a verified full-cost operation.",'),
            ('line: "Measurement is part of the object.",', 'line: "Useful evaluations. No shared system-level yardstick.",'),
            ('body: "The original chart, evidence review, testing record, and benchmark-native results—restored as one complete artifact.",', 'body: "Useful model and system studies exist. Our review has not identified an accepted cross-system standard for harmful manipulation as framed by the EU GPAI Code.",'),
            ('line: "Evidence thins downstream.",', 'line: "Real operations. Unresolved electoral effects.",'),
            ('body: "What public election records establish about operations, exposure, response, and electoral consequence.",', 'body: "Documented influence attempts and harms, including harassment and confusion. Individual and election-wide effects remain bounded or unresolved; proliferation is a hypothesis, not our estimate.",'),
            ('body: "Source-linked review of 118 interventions: what changes, what remains untested, and whose agency a safeguard protects.",', 'body: "Concrete legal and research examples, from AI-origin marking and ChatGPT’s DSA designation to tested sharing interventions. Recommendations remain provisional; adoption is not effectiveness.",'),
            ('<div className="v2-feature-label">Featured artifact</div>', '<div className="v2-feature-label">Featured draft artifact</div>'),
            ('A draft research programme on how frontier AI capability becomes deployed influence infrastructure, where evidence weakens between capability and effect, and what that means for democratic self-correction.', 'A research programme in progress on how frontier AI could become influence infrastructure, who controls it, and when practical agency shifts away from citizens and democratic institutions.'),
            ('It does not show that frontier AI changed an election.', 'All programme results and recommendations are provisional and not peer reviewed. Documented harms do not establish that AI changed an election.'),
            ('Conceptual illustration. Evidence is stronger upstream and progressively weaker across authentic exposure, human response, and aggregate consequence.', 'Conceptual illustration, not a measured universal law. The reviewed records establish operations more readily than authentic exposure, durable human response or electoral consequence.'),
            ('All findings and artifacts are provisional and subject to revision.', 'All programme findings, coding, interpretations and recommendations are work in progress, subject to correction and not independently replicated.'),
            ('<PageLead eyebrow="Part I · Operations" title="Access is not control" deck="A model name hides the served system around it: route, safeguards, context, memory, tools, permissions, retries, and operator interaction. Deployment adds an actor, objective, data, authority, distribution, feedback, and persistence.">', '<PageLead eyebrow="Part I · Capability and operations · Draft / work in progress" title="How far can an adversarial actor go with $10?" deck="Pretty far, actually—for planning and synthetic prototypes. This is an author-reported exploratory pilot, not a verified $10 influence campaign.">'),
            ('<DraftBoundary>No successful intervention, autonomous execution, authentic audience contact, persuasion, durable agency transfer, or electoral effect.</DraftBoundary>', '<DraftBoundary>Planning assistance and synthetic prototypes are not a demonstrated live operation. No autonomous execution, authentic audience contact, human persuasion, durable agency transfer or electoral effect was established by these tests.</DraftBoundary>'),
            ('</PageLead>\n      <div className="v2-wide-figure v2-wide-figure--mechanism">', '</PageLead>\n      <BudgetBoundary />\n      <div className="v2-wide-figure v2-wide-figure--mechanism">'),
            ('<p className="v2-eyebrow">Observed</p><h2>Planning assistance and conversion constraints</h2>', '<p className="v2-eyebrow">Provisional programme record</p><h2>Planning assistance, not demonstrated execution</h2>'),
            ('One recorded served route produced recognisable campaign-planning elements after some tactical refusals. A separate intervention study did not create a durable package that could be independently reloaded.', 'The author-reported pilot describes multi-step, multimodal prototyping. In a closer-inspected subset, one served route produced campaign-planning elements after some tactical refusals. These records do not establish a reliable success rate or retained capability. A separate model-intervention study failed to produce an independently reloadable package.'),
            ('Use exact routes, a closed synthetic election environment, reversible state, matched controls, permission boundaries, clean reload, and a human-only baseline.', 'Reconcile the full budget and evidence units. Compare exact system versions with a human-only baseline in a closed synthetic environment. Record time, quality, missing outputs and permission failures, with blinded review and independent replication.'),
          ])
          edit('src/editorial/EditorialShell.tsx', [
            ('title: "Part I · Operations · Harmful Manipulation and Election Security",', 'title: "Part I · How far can an adversarial actor go with $10? · Draft",'),
            ('description: "Why model access is not operational control, and why planning output is not deployment.",', 'description: "Author-reported low-cost sandbox planning, with explicit full-cost and evidence limits. Not a verified influence campaign.",'),
            ('description: "Why election records document operations and institutional responses more readily than authentic exposure or effect.",', 'description: "Documented influence attempts, harassment and confusion; bounded human evidence and unresolved electoral effects.",'),
            ('    document.title = entry.title;', '    const pageTitle = /draft/i.test(entry.title) ? entry.title : `${entry.title} · Draft`;\n    document.title = pageTitle;'),
            ('if (description) description.content = entry.description;', 'if (description) description.content = `${entry.description} Research in progress; programme findings and recommendations are provisional, not peer reviewed.`;'),
            ('if (ogTitle) ogTitle.content = entry.title;', 'if (ogTitle) ogTitle.content = pageTitle;'),
            ('if (ogDescription) ogDescription.content = entry.description;', 'if (ogDescription) ogDescription.content = `${entry.description} Working draft; provisional programme findings.`;'),
            ('<div><span aria-hidden="true" /><strong>Working draft</strong><p>Research programme · not peer reviewed · all findings are provisional.</p></div>', '<div><span aria-hidden="true" /><strong>Draft · work in progress</strong><p>All programme results and recommendations are provisional · not peer reviewed. <a href={route("about/#evidence-status")}>Evidence key</a></p></div>'),
            ('Draft research by Miguel Guerrero · ERA:AI Summer Research Fellowship, Cambridge · 2026.', 'Draft research by Miguel Guerrero · ERA:AI Summer Research Fellowship, Cambridge · 2026. Programme results, interpretations and recommendations remain provisional; no independent replication.'),
            ('<strong>Claim boundary</strong>', '<strong>Provisional claim boundary</strong>'),
          ])
          edit('src/editorial/PolicyPage.tsx', [
            ('import "./policy-review.css";', 'import "./policy-review.css";\nimport { PolicyExamples } from "./PolicyExamples";'),
            ('<section className="p4-section" aria-labelledby="p4-recommendations">', '<PolicyExamples />\n\n      <section className="p4-section" aria-labelledby="p4-recommendations">'),
            ('<p className="v2-eyebrow">Revised recommendations</p>', '<p className="v2-eyebrow">Provisional recommendation framework</p>'),
            ('This page condenses the 1 September source-linked review. Examples in the supporting dossiers are hypothetical; no live voter intervention was conducted.', 'This page combines the 1 September source-linked review with a separately identified legal and empirical web supplement. Dossier scenarios are hypothetical; cited external policies, studies and incidents are real source records. They are not fellowship interventions or proof of electoral protection.'),
          ])
          edit('src/LegacyRegistryApp.tsx', [
            ('import { useEffect, useState } from "react";', 'import { useEffect, useState } from "react";\nimport { MeasurementGap } from "./components/ResearchStatus";'),
            ('document.title = title;', 'document.title = `${title} · Draft / work in progress`;'),
            ('The original Agency Transfer Benchmark registry, evidence review, and testing record.', 'Draft evaluation registry and research in progress. Native measures remain useful; a common validated system-level harmful-manipulation instrument remains unresolved.'),
            ('Independent Cambridge:ERA research · not an official ERA benchmark', 'Provisional programme results · not peer reviewed · not an official ERA benchmark'),
            ('<span>Draft · 12 August 2026</span>', '<span>Draft / work in progress · presentation revised 1 September 2026 · source dates vary</span>'),
            ('        {error ? <p className="inline-data-error" role="alert">Some chart data could not load:', '        <MeasurementGap compact />\n        {error ? <p className="inline-data-error" role="alert">Some chart data could not load:'),
            ('No source measures harmful manipulation capability end to end. The literature separately observes', 'In the sources reviewed, no single accepted instrument covers harmful manipulation across deployed systems. The literature separately observes'),
            ('      <section className="section literature-section" id="literature">', '      <MeasurementGap />\n      <section className="section literature-section" id="literature">'),
            ('<h1>Confirmatory results only</h1>', '<h1>Testing in progress</h1>'),
            ('Exploratory runs stay in the audit trail. A comparison appears here only after route integrity, a frozen protocol, blinded human validation, and uncertainty checks pass.', 'These are provisional testing records, not automatically admitted findings. Confirmatory claims require route integrity, a frozen protocol, human-calibrated validation and uncertainty checks. The current non-confirmatory runs remain visible in the audit trail.'),
          ])
          path = root / 'src/editorial/ResourcePages.tsx'
          text = path.read_text()
          text = 'import { EvidenceStatusKey, WebRevisionNote } from "../components/ResearchStatus";\n' + text
          path.write_text(text)
          edit('src/editorial/ResourcePages.tsx', [
            ('      <section className="v2-paper-abstract" id="abstract">', '      <WebRevisionNote />\n      <section className="v2-paper-abstract" id="abstract">'),
            ('      <section className="v2-about-grid">', '      <EvidenceStatusKey />\n      <section className="v2-about-grid">'),
            ('deck="The paper supplies the argument. The four research parts supply the evidence record. Visuals, datasets, and tools make specific mechanisms inspectable without silently upgrading the claim."', 'deck="All programme outputs are drafts and work in progress, not peer-reviewed conclusions. The paper supplies the argument; datasets and tools supply inspectable, provisional records. External sources retain their own publication status."'),
            ('<section className="v2-update-list">', '<section className="v2-update-list"><article><time>1 Sep 2026</time><div><h2>Draft status, four research questions and concrete policy examples</h2><p>Made provisional status and evidence labels explicit across the site. Part I now asks how far an adversary can go with $10, with direct-service, separate compute and unverified full-cost limits. Part II foregrounds the unresolved system-level measurement standard. Part III separates real attempts and harms from unknown electoral effects. Part IV adds specific legal and research examples, including AI-origin marking and ChatGPT’s VLOSE designation, without upgrading empirical grades or the v1.3 PDF.</p></div></article>'),
          ])
          titles = {
            'index.html': 'Harmful Manipulation and Election Security',
            'research/index.html': 'Four research questions · Agency Transfer',
            'research/part-i/index.html': 'How far can an adversarial actor go with $10? · Part I',
            'research/part-ii/index.html': 'Evaluation Registry · Part II',
            'research/part-ii/evidence/index.html': 'Evaluation evidence · Part II',
            'research/part-ii/testing/index.html': 'Testing in progress · Part II',
            'research/part-iii/index.html': 'Real operations. Unresolved electoral effects. · Part III',
            'research/part-iv/index.html': 'What works—and for whom? · Part IV',
            'registry/index.html': 'Evaluation Registry · Agency Transfer',
            'registry/evidence/index.html': 'Evaluation evidence · Agency Transfer',
            'registry/testing/index.html': 'Testing in progress · Agency Transfer',
            'paper/index.html': 'Working paper v1.3 · Agency Transfer',
            'outputs/index.html': 'Research outputs · Agency Transfer',
            'explainers/index.html': 'Conceptual explainers · Agency Transfer',
            'updates/index.html': 'Research revision log · Agency Transfer',
            'about/index.html': 'About and evidence status · Agency Transfer',
            'evidence/index.html': 'Evaluation evidence · Agency Transfer',
            'testing/index.html': 'Testing in progress · Agency Transfer',
          }
          description = 'Research in progress on frontier AI, harmful manipulation and agency transfer. Programme results, coding and recommendations are provisional, not peer reviewed.'
          for name, title in titles.items():
              p = root / name
              t = p.read_text()
              title = html.escape(title + ' · Draft')
              t, n = re.subn(r'<title>[^<]*</title>', f'<title>{title}</title>', t)
              assert n == 1, (name, 'title')
              t = re.sub(r'\s*<meta\b(?=[^>]*(?:name|property)=[\"\x27](?:description|og:title|og:description)[\"\x27])[^>]*>', '', t)
              meta = f'\n    <meta name="description" content="{description}" />\n    <meta property="og:title" content="{title}" />\n    <meta property="og:description" content="{description}" />\n'
              assert '</head>' in t
              t = t.replace('</head>', meta+'  </head>')
              p.write_text(t.rstrip()+'\n')
          # The standalone animation already has a visible draft badge. Preserve
          # its composition and add the work-in-progress boundary to its metadata.
          ap = root / 'public/media/cde-rift-animation/index.html'
          at = ap.read_text()
          assert 'class="draft"' in at and 'Working Draft' in at
          at = at.replace('Working-draft animated explanation of the Capability–Deployment–Effect Rift.', 'Draft / work in progress. Conceptual explanation, not an empirical effect estimate or peer-reviewed result.')
          at = re.sub(r'(<[^>]*class="draft"[^>]*>)[^<]*(</[^>]+>)', r'\1Draft · work in progress\2', at, count=1)
          ap.write_text(at.rstrip()+'\n')
          hashes = {
              'public/media/cde-gap3-hero-1672.webp': '5d41200d1aa40f4e76117cf542166c33905b7ec6343d98ba5718eff2b65f13ae',
              'public/research/harmful-manipulation-election-security-v1.3-20260901.pdf': '9049528ada708e9c5d591fac2343ef53d89a86d5e1d2703d22b1ef84bf701c5e',
              'public/research/p4-source-linked-review-20260901.xlsx': '2104cb1851d5661ddacd0ae0b616e11a9c8ed6ef904d988d1ff7a305f9cdc421',
          }
          for name, digest in hashes.items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == digest, name
          print('Reviewed content integrated; 18 route metadata records updated; original artifacts preserved.')
          PY
      - name: Validate and build
        run: |
          npm ci
          npm run build
          git diff --check
      - name: Install browser tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Review desktop and mobile pages
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, time
          from playwright.sync_api import sync_playwright
          root = pathlib.Path.cwd()
          out = root/'draft-review'
          out.mkdir()
          server = root/'_draft_preview'
          server.mkdir()
          (server/'agencytransfer').symlink_to(root/'dist',target_is_directory=True)
          proc = subprocess.Popen(['python','-m','http.server','8765','--directory',str(server)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          time.sleep(1)
          base = 'http://127.0.0.1:8765/agencytransfer/'
          report = {'mode':'preview','pages':[],'result':'pending'}
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  for width in (1440,390):
                      context = browser.new_context(viewport={'width':width,'height':1000 if width==1440 else 844})
                      page = context.new_page()
                      errors = []
                      page.on('pageerror',lambda e: errors.append(str(e)))
                      routes = ('','research/','research/part-i/','research/part-iii/','research/part-iv/','registry/','registry/evidence/','registry/testing/','paper/','outputs/','about/','updates/','explainers/')
                      for slug in routes:
                          response = page.goto(base+slug, wait_until='networkidle', timeout=30000)
                          assert response.status == 200, (slug,response.status)
                          page.locator('h1').first.wait_for()
                          text = page.locator('body').inner_text().lower()
                          assert 'draft' in text and 'progress' in text and 'not peer reviewed' in text, (slug,'status missing')
                          assert 'draft' in page.title().lower(), (slug,'title status')
                          sw = page.evaluate('document.documentElement.scrollWidth')
                          if sw > width+1:
                              assert slug=='registry/evidence/' and width==390 and sw<=696, (slug,width,sw,'new overflow')
                          if slug=='':
                              cards = page.locator('.v2-parts--simple .v2-part-card')
                              assert cards.count()==4
                              assert all(c.locator('a').count()==1 for c in cards.all())
                              assert cards.nth(1).locator('a').get_attribute('href')=='/agencytransfer/registry/'
                              assert 'cde-gap3-hero-' in page.locator('.v2-hero-art img').get_attribute('src')
                          if slug=='research/part-i/':
                              assert page.locator('h1').inner_text()=='How far can an adversarial actor go with $10?'
                              assert 'pretty far, actually' in text and 'us$500' in text and 'author-reported' in text
                          if slug=='research/part-iv/':
                              assert page.locator('.policy-example').count()==6
                              assert page.locator('.p4-portfolios article').count()==4
                              assert page.locator('.p4-findings details').count()==6
                              assert 'four months after notification' in text
                              for item in page.locator('.policy-example').all():
                                  assert item.locator('a').count()>=1
                                  item.locator('summary').click()
                                  assert item.locator('details').get_attribute('open') is not None
                                  item.locator('summary').click()
                          if slug=='registry/':
                              assert page.locator('.measurement-gap--compact').count()==1
                          if slug=='registry/evidence/':
                              assert page.locator('#measurement-gap').count()==1
                          if slug=='about/':
                              assert page.locator('.evidence-status-key dt').count()==5
                          if slug=='paper/':
                              assert page.locator('a[href$="v1.3-20260901.pdf"]').count()==1
                              assert page.locator('.web-revision-note').count()==1
                          report['pages'].append({'path':slug,'viewport':width,'status':response.status,'h1':page.locator('h1').first.inner_text(),'scroll_width':sw})
                          if slug in ('','research/part-i/','research/part-iii/','research/part-iv/','registry/','about/'):
                              page.evaluate("document.documentElement.style.scrollBehavior='auto'; if(document.activeElement instanceof HTMLElement) document.activeElement.blur(); window.scrollTo(0,0)")
                              page.wait_for_timeout(100)
                              name=(slug or 'home').strip('/').replace('/','-')
                              page.screenshot(path=str(out/f'{name}-{width}.png'),full_page=True)
                      assert not errors, errors
                      context.close()
                  browser.close()
              report['result']='pass'
          except Exception as e:
              report['result']='fail'
              report['error']=str(e)
              raise
          finally:
              (out/'report.json').write_text(json.dumps(report,indent=2))
              proc.terminate()
          print(json.dumps(report,indent=2))
          PY
      - name: Commit the validated content only
        run: |
          git add src/editorial/ProgrammePages.tsx src/editorial/EditorialShell.tsx src/editorial/PolicyPage.tsx src/editorial/ResourcePages.tsx src/LegacyRegistryApp.tsx index.html research registry paper outputs explainers updates about evidence testing public/media/cde-rift-animation/index.html
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Clarify provisional findings and the four research questions across all live routes'
          git push origin HEAD:draft-humility-four-parts-20260901
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-status-browser-review
          path: draft-review
          retention-days: 7
