name: Prepare publication review
on:
  push:
    branches: [publication-usability-references-20260901]
    paths: [.github/workflows/publication-review-once.yml]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Package public sources and build dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/publication-review"
          git archive HEAD -o "$RUNNER_TEMP/publication-review/sources.zip"
          tar -czf "$RUNNER_TEMP/publication-review/node-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: publication-review-sources
          path: ${{ runner.temp }}/publication-review
          retention-days: 3
