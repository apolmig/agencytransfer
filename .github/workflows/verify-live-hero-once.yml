name: Verify live hero and HTTPS
on:
  push:
    branches: [replace-hero-with-final-cde-illustration]
    paths: [.github/workflows/verify-live-hero-once.yml]
permissions:
  contents: read
  pages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Install browser test client
        run: |
          python -m pip install --quiet playwright==1.55.0
          if ! command -v google-chrome >/dev/null; then python -m playwright install --with-deps chromium; fi
      - name: Verify live asset hashes, TLS, desktop and mobile
        run: |
          mkdir -p verification
          python - <<'PY'
          import datetime, hashlib, json, pathlib, shutil, socket, ssl, urllib.request, urllib.error
          from playwright.sync_api import sync_playwright
          root=pathlib.Path('verification')
          base='https://miguelguerrero.eu/agencytransfer/'
          report={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'deployed_commit':'136a92d6cecaf312be3935e062a927cee87e42d0','assets':[],'browser':[]}
          for name, expected in {
              'cde-gap3-hero-824.webp':'6c7b9122060da0c052aca02343c458a46672fd7d6edee0b224d44879fccaceb6',
              'cde-gap3-hero-1672.webp':'5d41200d1aa40f4e76117cf542166c33905b7ec6343d98ba5718eff2b65f13ae'
          }.items():
              url=base+'media/'+name
              with urllib.request.urlopen(url,timeout=30) as response:
                  raw=response.read()
                  digest=hashlib.sha256(raw).hexdigest()
                  report['assets'].append({'url':url,'status':response.status,'mime_type':response.headers.get('Content-Type'),'bytes':len(raw),'sha256':digest,'matches_optimized_original':digest==expected})
                  assert digest==expected, f'Live image differs: {name}'
          with socket.create_connection(('miguelguerrero.eu',443),timeout=20) as connection:
              with ssl.create_default_context().wrap_socket(connection,server_hostname='miguelguerrero.eu') as tls:
                  report['https']={'certificate_and_hostname_validated':True,'protocol':tls.version(),'certificate':tls.getpeercert()}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):return None
          try:
              response=urllib.request.build_opener(NoRedirect).open(urllib.request.Request(base.replace('https:','http:'),method='HEAD'),timeout=20)
          except urllib.error.HTTPError as error:
              response=error
          report['http']={'status':response.status,'location':response.headers.get('Location'),'redirects_to_https':response.status in (301,302,307,308) and str(response.headers.get('Location','')).startswith('https://')}
          with sync_playwright() as p:
              executable=shutil.which('google-chrome')
              browser=p.chromium.launch(executable_path=executable,headless=True,args=['--no-sandbox']) if executable else p.chromium.launch(headless=True)
              for label,width,height,dpr in [('desktop',1440,1100,1),('mobile',390,844,2)]:
                  context=browser.new_context(viewport={'width':width,'height':height},device_scale_factor=dpr,ignore_https_errors=False)
                  page=context.new_page(); errors=[]; insecure=[]; responses=[]
                  page.on('pageerror',lambda e:errors.append(str(e)))
                  page.on('request',lambda r:insecure.append(r.url) if r.url.startswith('http://') else None)
                  response=page.goto(base,wait_until='networkidle',timeout=45000)
                  assert response and response.status==200
                  image=page.locator('.v2-hero-art--supplied img')
                  image.wait_for(timeout=15000)
                  page.wait_for_function("document.querySelector('.v2-hero-art--supplied img').complete && document.querySelector('.v2-hero-art--supplied img').naturalWidth > 0")
                  details=image.evaluate('(im)=>({currentSrc:im.currentSrc,naturalWidth:im.naturalWidth,naturalHeight:im.naturalHeight,renderedWidth:im.width,renderedHeight:im.height,fetchPriority:im.fetchPriority,loading:im.loading,complete:im.complete})')
                  details.update({'viewport':label,'page_url':page.url,'page_status':response.status,'mixed_content_requests':insecure,'javascript_errors':errors,'horizontal_overflow':page.evaluate('document.documentElement.scrollWidth > innerWidth'),'tls':response.security_details()})
                  page.screenshot(path=str(root/f'hero-{label}.png'),full_page=True)
                  report['browser'].append(details)
                  assert '/media/cde-gap3-hero-' in details['currentSrc'], 'Old hero still in page'
                  assert not errors and not insecure and not details['horizontal_overflow'], details
                  context.close()
              context=browser.new_context(ignore_https_errors=False)
              page=context.new_page(); registry_errors=[]
              page.on('pageerror',lambda e:registry_errors.append(str(e)))
              response=page.goto(base+'registry/',wait_until='networkidle',timeout=45000)
              body=page.inner_text('body')
              report['registry']={'status':response.status if response else None,'chart_present':'Chart' in body,'evidence_present':'Evidence' in body,'testing_present':'Testing' in body,'javascript_errors':registry_errors}
              assert response and response.status==200 and all(report['registry'][k] for k in ('chart_present','evidence_present','testing_present'))
              context.close();browser.close()
          report['result']='passed'
          (root/'live-review.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Read Pages HTTPS setting
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/apolmig/agencytransfer/pages --jq '{https_enforced,html_url,cname,status,build_type}' > verification/pages-settings.json 2> verification/pages-settings-error.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-hero-and-https-review
          path: verification/
          retention-days: 7
