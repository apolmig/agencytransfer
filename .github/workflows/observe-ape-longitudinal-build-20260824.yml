name: Observe APE longitudinal build

on:
  push:
    branches:
      - agent/observe-ape-longitudinal-build-20260824
    paths:
      - .github/workflows/observe-ape-longitudinal-build-20260824.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/observe-ape-longitudinal-build-20260824
          fetch-depth: 1
          persist-credentials: true
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dispatch-results
          gh run list --repo "$REPOSITORY" \
            --workflow one-shot-build-ape-deepseek-longitudinal-v01.yml \
            --limit 10 \
            --json databaseId,status,conclusion,headSha,headBranch,event,createdAt,updatedAt,url,workflowName \
            > dispatch-results/ape-deepseek-longitudinal-build-runs-20260824.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispatch-results/ape-deepseek-longitudinal-build-runs-20260824.json
          git commit -m 'Record APE longitudinal build state'
          git push origin HEAD:agent/observe-ape-longitudinal-build-20260824

