name: Inspect CWE empirical pilot
on:
  push:
    branches: [research/inspect-hackathon-20260905]
    paths:
      - '.github/workflows/inspect-cwe-run.yml'
      - 'inspect-cwe-pilot/**'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        size: ['0.5B', '1.5B']
    env:
      OMP_NUM_THREADS: '4'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install CPU inference and Inspect
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install inspect-ai==0.3.263 inspect-viz==0.4.1 inspect-evals==0.19.0 transformers==5.15.1 'accelerate>=1.12,<2'
          mkdir -p empirical
          python -m pip freeze > empirical/requirements-resolved.txt
          cp inspect-cwe-pilot/minieval.py empirical/minieval.py
          git rev-parse HEAD > empirical/code-commit.txt
      - name: Run frozen 24-pair pilot through native Inspect HF provider
        run: |
          python -u inspect-cwe-pilot/minieval.py --model 'Qwen/Qwen2.5-${{ matrix.size }}-Instruct' --n 24 --output empirical
      - name: Preserve original Inspect logs and provenance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: inspect-cwe-${{ matrix.size }}
          path: empirical/
          retention-days: 14
          if-no-files-found: error
