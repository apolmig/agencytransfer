name: One-shot export APE-120 v0.2 candidates

on:
  push:
    branches:
      - agent/ape120-v02-corrected
    paths:
      - .github/workflows/one-shot-export-ape120-candidates-v02.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v6
        with:
          ref: agent/ape120-v02-corrected
          fetch-depth: 1
          persist-credentials: true

      - name: Require the deliberate export commit
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$HEAD_MESSAGE" = "Export frozen APE120 v0.2 candidate ledger"

      - name: Export and verify candidate CSV
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_ape120_candidates_v02.py
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path('evals/research-notes/ape120-primary-candidates-v0.2.csv')
          with path.open(encoding='utf-8', newline='') as handle:
              rows = list(csv.DictReader(handle))
          if len(rows) != 66:
              raise SystemExit(f'candidate row count mismatch: {len(rows)}')
          if len({row['model_id'] for row in rows}) != 66:
              raise SystemExit('candidate model IDs are not unique')
          if [int(row['priority']) for row in rows] != list(range(1, 67)):
              raise SystemExit('candidate priorities are not contiguous')
          if any(
              row['secondary_ape_status']
              != 'eligible_no_exact_secondary_ape_in_frozen_ledger'
              for row in rows
          ):
              raise SystemExit('secondary APE exclusion status mismatch')
          PY
          git diff --check

      - name: Upload candidate CSV artifact
        uses: actions/upload-artifact@v6
        with:
          name: ape120-primary-candidates-v0.2
          path: evals/research-notes/ape120-primary-candidates-v0.2.csv
          if-no-files-found: error
          retention-days: 30

      - name: Commit the ledger and remove one-shot machinery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-export-ape120-candidates-v02.yml
          rm scripts/export_ape120_candidates_v02.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/one-shot-export-ape120-candidates-v02.yml \
            scripts/export_ape120_candidates_v02.py \
            evals/research-notes/ape120-primary-candidates-v0.2.csv
          git commit -m "Publish frozen APE-120 v0.2 candidate ledger"
          git push origin HEAD:agent/ape120-v02-corrected
