name: One-shot correct and verify APE-120 v0.2

on:
  push:
    branches:
      - agent/ape120-v02-corrected
    paths:
      - .github/workflows/one-shot-ape120-v02-correct.yml

permissions:
  contents: write

jobs:
  correct-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@v6
        with:
          ref: agent/ape120-v02-corrected
          fetch-depth: 1
          persist-credentials: true

      - name: Require the deliberate bootstrap commit
        shell: bash
        env:
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          test "$HEAD_MESSAGE" = "Complete corrected APE120 v0.2 bootstrap"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Apply the reviewed repository patch
        run: python scripts/one_shot_patch_ape120_v02.py

      - name: Install the frozen development environment
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --group dev

      - name: Generate and verify the frozen v0.2 plan
        run: |
          set -euo pipefail
          uv run --frozen python scripts/build_ape120_primary_plan.py \
            --output evals/config/ape120-primary-v0.2.json
          test "$(jq -r '.protocol_id' evals/config/ape120-primary-v0.2.json)" = "atb-ape120-primary-20260825-v0.2"
          test "$(jq -r '.execution.max_samples' evals/config/ape120-primary-v0.2.json)" = "120"
          test "$(jq -r '.dataset.expected_samples_per_model' evals/config/ape120-primary-v0.2.json)" = "120"
          test "$(jq -r '.execution.planned_execution_envelope_usd' evals/config/ape120-primary-v0.2.json)" = "29.25"
          test "$(jq -r '.execution.minimum_stop_reserve_usd' evals/config/ape120-primary-v0.2.json)" = "0.75"

      - name: Format, lint, and test without model inference
        run: |
          set -euo pipefail
          touched=(
            evals/atb_eval/ape_primary_runner.py
            scripts/build_ape120_primary_plan.py
            tests/evals/test_ape120_primary.py
          )
          uv run --frozen ruff format "${touched[@]}"
          uv run --frozen ruff check --fix "${touched[@]}"
          uv run --frozen ruff format --check "${touched[@]}"
          uv run --frozen ruff check "${touched[@]}"
          uv run --frozen pytest -q tests/evals/test_ape120_primary.py
          uv run --frozen pytest -q
          git diff --check

      - name: Commit one corrected protocol version
        run: |
          set -euo pipefail
          test ! -e .github/workflows/one-shot-ape120-v02-correct.yml
          rm -f scripts/one_shot_patch_ape120_v02.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/one-shot-ape120-v02-correct.yml \
            scripts/one_shot_patch_ape120_v02.py \
            evals/atb_eval/ape_primary_runner.py \
            scripts/build_ape120_primary_plan.py \
            tests/evals/test_ape120_primary.py \
            evals/config/ape120-primary-v0.2.json \
            evals/research-notes/ape120-primary-v0.1-retired.md
          git commit -m "Correct and freeze APE-120 primary protocol v0.2"
          git push origin HEAD:agent/ape120-v02-corrected
