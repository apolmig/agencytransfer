name: One-shot APE live canary v0.2 patch

on:
  push:
    branches:
      - agent/ape-rate-limit-missingness-fix
    paths:
      - .github/workflows/one-shot-ape-canary-v02-patch.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@v6
        with:
          ref: agent/ape-rate-limit-missingness-fix
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up locked uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Apply the exact evidence-led repair
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode > "$RUNNER_TEMP/patch_ape_v02.py"
          python "$RUNNER_TEMP/patch_ape_v02.py"

      - name: Install the frozen development environment
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --group dev

      - name: Format, lint, and test the repair
        run: |
          set -euo pipefail
          uv run --frozen ruff format evals/atb_eval/tasks/ape.py tests/evals/test_ape_task.py
          uv run --frozen ruff check --fix evals/atb_eval/tasks/ape.py tests/evals/test_ape_task.py
          uv run --frozen ruff format --check evals/atb_eval/tasks/ape.py tests/evals/test_ape_task.py
          uv run --frozen ruff check evals/atb_eval/tasks/ape.py tests/evals/test_ape_task.py
          uv run --frozen pytest tests/evals/test_ape_task.py
          uv run --frozen pytest

      - name: Commit only the reviewed repair artifacts
        run: |
          set -euo pipefail
          test ! -e .github/workflows/one-shot-ape-canary-v02-patch.yml
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/one-shot-ape-canary-v02-patch.yml \
            evals/atb_eval/tasks/ape.py \
            tests/evals/test_ape_task.py \
            evals/manifests/ape-live-canary-v0.2.json \
            evals/research-notes/ape-live-canary-v0.1-run-32739612523.md
          git commit -m 'Fix APE provider missingness and freeze canary v0.2'
          git push origin HEAD:agent/ape-rate-limit-missingness-fix
