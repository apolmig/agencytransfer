name: One-shot export APE120 branch sources

on:
  push:
    branches:
      - agent/ape120-longitudinal-20260825
    paths:
      - .github/workflows/one-shot-export-ape120-sources.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ape120-longitudinal-20260825
          fetch-depth: 1
          persist-credentials: false
      - name: Create review snapshot
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/agencytransfer-ape120-sources.zip" HEAD
      - name: Upload review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: agencytransfer-ape120-sources-${{ github.run_id }}
          path: ${{ runner.temp }}/agencytransfer-ape120-sources.zip
          if-no-files-found: error
          retention-days: 1
