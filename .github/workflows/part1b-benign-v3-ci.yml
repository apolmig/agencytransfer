name: Part 1B benign adapters v3

on:
  pull_request:
    paths:
      - "part1b/benign_adapters_v3/**"
      - ".github/workflows/part1b-benign-v3-ci.yml"
  push:
    branches: [main]
    paths:
      - "part1b/benign_adapters_v3/**"
      - ".github/workflows/part1b-benign-v3-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal signature-test dependency
        run: python -m pip install --disable-pip-version-check cryptography==49.0.0
      - name: Compile
        run: |
          python -m py_compile \
            part1b/benign_adapters_v3/jobs/train_lora.py \
            part1b/benign_adapters_v3/jobs/ml_stack_preflight.py \
            part1b/benign_adapters_v3/tests/test_contract.py
      - name: Frozen dataset, authorization, persistence, and ML contracts
        run: python -m unittest discover -s part1b/benign_adapters_v3/tests -v
      - name: Validate both adapters without ML dependencies
        run: |
          python part1b/benign_adapters_v3/jobs/train_lora.py \
            --adapter transparent_persuasion --phase production \
            --run-id github-ci-validation --seed 17 --validate-only >/tmp/p.json
          python part1b/benign_adapters_v3/jobs/train_lora.py \
            --adapter public_osint --phase production \
            --run-id github-ci-validation --seed 17 --validate-only >/tmp/o.json
          python -m json.tool /tmp/p.json >/dev/null
          python -m json.tool /tmp/o.json >/dev/null
          python -m json.tool part1b/benign_adapters_v3/protocol.json >/dev/null
      - name: Verify frozen protocol pin
        run: >-
          python -c "import hashlib,importlib.util,pathlib;
          p=pathlib.Path('part1b/benign_adapters_v3');
          s=importlib.util.spec_from_file_location('runner',p/'jobs/train_lora.py');
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m);
          actual=hashlib.sha256((p/'protocol.json').read_bytes()).hexdigest();
          assert actual==m.EXPECTED_PROTOCOL_SHA256,(actual,m.EXPECTED_PROTOCOL_SHA256)"
