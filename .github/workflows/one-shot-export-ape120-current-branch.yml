name: One-shot export current APE120 branch

on:
  push:
    branches:
      - agent/ape120-longitudinal-20260825
    paths:
      - .github/workflows/one-shot-export-ape120-current-branch.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/ape120-longitudinal-20260825
          fetch-depth: 1
          persist-credentials: false
      - name: Archive current source tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/ape120-current-branch.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ape120-current-branch-${{ github.run_id }}
          path: ${{ runner.temp }}/ape120-current-branch.zip
          if-no-files-found: error
          retention-days: 1
