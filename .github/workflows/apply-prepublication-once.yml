name: Apply unpublished-paper presentation
on:
  push:
    branches: [prepublication-status-20260903]
    paths: [.github/workflows/apply-prepublication-once.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: prepublication-status-20260903
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply the reviewed copy changes
        run: |
          test "$(git rev-parse origin/main)" = 4dad5c21ee51d4c6709d25dea45566c9cffd67e5
          python scripts/apply-prepublication-once.py
          python scripts/build-reference-page.py
          python scripts/validate-publication.py
      - name: Build and preserve the research record
        run: |
          npm ci
          npm run build
          git diff --check
          git diff --exit-code origin/main -- src/LegacyRegistryApp.tsx src/components/FrontierTimeline.tsx src/components/LiteratureReview.tsx src/styles.css public/data data evals public/media/cde-gap3-hero-1672.webp public/media/cde-gap3-hero-824.webp public/research/harmful-manipulation-election-security-v1.5-20260901.pdf public/research/harmful-manipulation-election-security-v1.3-20260901.pdf
      - name: Browser acceptance checks
        run: |
          python -m pip install --quiet playwright
          REVIEW_WIDTHS=1440,768,390,320 python scripts/review-paper-status.py
      - name: Record the publication boundary
        run: |
          mkdir -p programme/reviews
          cat > programme/reviews/20260903-paper-publication-status.md <<'EOF'
          # Working-paper publication status

          The author has not made a formal public paper release. The website now presents an unnumbered, unpublished working draft and marks the full working paper as coming soon.

          - Removed active manuscript PDF and earlier-edition links from the publication pages. The overview, bibliography and research records remain available.
          - Removed release-style manuscript numbers from the homepage, paper page, policy summary, references interface, static bibliography, About, revision log, page metadata and preferred citation.
          - Replaced the paper overview's SVG with the author's existing PNG-derived, responsive WebP CDE illustration. No image regeneration or empirical chart substitution was performed.
          - Shortened the suggested citation, preserving the full title and identifying an unpublished draft.
          - Set the manifest's paper-release identifier to null. No arbitrary replacement number is assigned; the first formal release remains pending.

          Historical manuscript files and their original filenames remain intact for provenance; this update does not retroactively make earlier shared copies private. They are no longer advertised as published editions. External source versions, software schema versions, Registry observations and datasets are not renumbered. All 431 reference records are unchanged; only the manuscript collection label and publication-status metadata changed.

          Browser checks cover manuscript status, no active manuscript PDF links, no numbered manuscript text on publication routes, responsive raster loading, the concise citation, shared navigation, reference search and the unchanged independent Registry entry point. Software checks concern presentation, not scientific validation.
          EOF
      - name: Commit only the bounded publication update
        run: |
          git add CITATION.cff README.md paper/index.html programme/project-manifest.json programme/reviews/20260903-paper-publication-status.md public/research/references.html public/research/references.json scripts/build-reference-page.py scripts/review-publication.py src/components/ResearchStatus.tsx src/editorial/EditorialShell.tsx src/editorial/PolicyPage.tsx src/editorial/ProgrammePages.tsx src/editorial/ReferencesPage.tsx src/editorial/ResourcePages.tsx
          git rm .github/workflows/prepublication-source-once.yml .github/workflows/apply-prepublication-once.yml scripts/apply-prepublication-once.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Present the manuscript as an unpublished working draft and replace the paper SVG'
          git push origin HEAD:prepublication-status-20260903
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paper-status-preview
          path: paper-status-review
          retention-days: 7
