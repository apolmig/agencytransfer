name: P2 public Actions observer 2026-08-24

on:
  push:
    branches:
      - agent/p2-public-actions-observer-20260824
    paths:
      - .github/workflows/p2-public-actions-observer-20260824.yml

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/p2-public-actions-observer-20260824
          fetch-depth: 1
          persist-credentials: true
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dispatch-results
          gh run list --repo "$REPOSITORY" \
            --workflow one-shot-ape-canary-v02-patch.yml --limit 10 \
            --json databaseId,status,conclusion,headSha,headBranch,event,createdAt,updatedAt,url,workflowName \
            > dispatch-results/ape-v02-patch-runs-20260824.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dispatch-results/ape-v02-patch-runs-20260824.json
          git commit -m 'Record APE v0.2 patch workflow state'
          git push origin HEAD:agent/p2-public-actions-observer-20260824

# refresh 2
