name: Part 1B benign adapters v7

on:
  pull_request:
    paths:
      - "part1b/benign_adapters_v7/**"
      - ".github/workflows/part1b-benign-v7-ci.yml"
      - ".github/workflows/part1b-benign-v7-runtime.yml"
      - ".gitattributes"
  push:
    branches: [main]
    paths:
      - "part1b/benign_adapters_v7/**"
      - ".github/workflows/part1b-benign-v7-ci.yml"
      - ".github/workflows/part1b-benign-v7-runtime.yml"
      - ".gitattributes"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify authoritative LF bytes
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("part1b/benign_adapters_v7")
          paths = (
              root / "jobs/train_lora.py",
              root / "jobs/ml_stack_preflight.py",
              root / ".dockerignore",
              root / "protocol.json",
              root / "requirements.lock",
              root / "runtime/Dockerfile",
              root / "tests/test_contract.py",
          )
          assert len(paths) == 7
          for path in paths:
              raw = path.read_bytes()
              assert b"\r" not in raw, f"{path}: carriage return found"
              assert raw.endswith(b"\n"), f"{path}: final LF missing"
              assert raw.decode("utf-8").encode("utf-8") == raw, f"{path}: not UTF-8"
          PY
      - name: Install pinned contract-test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          cryptography==49.0.0 huggingface-hub==1.24.0
      - name: Compile
        run: |
          python -m py_compile \
            part1b/benign_adapters_v7/jobs/train_lora.py \
            part1b/benign_adapters_v7/jobs/ml_stack_preflight.py \
            part1b/benign_adapters_v7/tests/test_contract.py
      - name: Frozen dataset, authorization, persistence, and ML contracts
        run: python -m unittest discover -s part1b/benign_adapters_v7/tests -v
      - name: Validate both adapters without ML dependencies
        run: |
          python part1b/benign_adapters_v7/jobs/train_lora.py \
            --adapter transparent_persuasion --phase production \
            --run-id github-ci-validation --seed 17 --validate-only >/tmp/p.json
          python part1b/benign_adapters_v7/jobs/train_lora.py \
            --adapter public_osint --phase production \
            --run-id github-ci-validation --seed 17 --validate-only >/tmp/o.json
          python -m json.tool /tmp/p.json >/dev/null
          python -m json.tool /tmp/o.json >/dev/null
          python -m json.tool part1b/benign_adapters_v7/protocol.json >/dev/null
      - name: Verify frozen protocol pin
        run: >-
          python -c "import hashlib,importlib.util,pathlib;
          p=pathlib.Path('part1b/benign_adapters_v7');
          s=importlib.util.spec_from_file_location('runner',p/'jobs/train_lora.py');
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m);
          actual=hashlib.sha256((p/'protocol.json').read_bytes()).hexdigest();
          assert actual==m.EXPECTED_PROTOCOL_SHA256,(actual,m.EXPECTED_PROTOCOL_SHA256)"
