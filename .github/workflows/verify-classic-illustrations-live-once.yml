name: Verify live classic illustration map
on:
  push:
    branches: [classic-illustration-map-20260903]
    paths: [.github/workflows/verify-classic-illustrations-live-once.yml]
permissions:
  contents: read
concurrency:
  group: live-classic-illustration-review
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: classic-illustration-map-20260903
      - name: Install browser bindings
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Wait for the deployed publication snapshot
        run: |
          python - <<'PY'
          import hashlib, pathlib, time, urllib.request, urllib.error
          base='https://miguelguerrero.eu/agencytransfer/'
          files=(
              'media/illustrations/anatomy-manipulation-1672.webp',
              'media/illustrations/policy-intervention-atlas-1600.webp',
              'media/illustrations/policy-circuit-breakers-1448.webp',
          )
          expected={name:hashlib.sha256((pathlib.Path('public')/name).read_bytes()).hexdigest() for name in files}
          ready=False
          for _ in range(45):
              try:
                  observed={}
                  for name in files:
                      request=urllib.request.Request(base+name,headers={'Cache-Control':'no-cache','User-Agent':'AgencyTransferLiveReview/1.0'})
                      with urllib.request.urlopen(request,timeout=20) as response:
                          observed[name]=hashlib.sha256(response.read()).hexdigest()
                  ready=observed==expected
                  if ready: break
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(8)
          assert ready,'The deployed illustration bytes were not ready within the verification window.'
          print('All three optimized illustration assets match the source branch on HTTPS production.')
          PY
      - name: Run live desktop and mobile acceptance checks
        env:
          REVIEW_BASE: https://miguelguerrero.eu/agencytransfer/
          REVIEW_OUTPUT: live-classic-artwork-review
        run: python scripts/review-classic-illustrations.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-classic-illustration-review
          path: live-classic-artwork-review
          retention-days: 7
