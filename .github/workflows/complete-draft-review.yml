name: Complete draft content review
on:
  push:
    branches: [draft-humility-four-parts-20260901]
    paths: [.github/workflows/complete-draft-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: draft-humility-four-parts-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install review tools
        run: |
          python -m pip install --quiet pyyaml playwright
          python -m playwright install --with-deps chromium
      - name: Apply the reviewed patch, normalize whitespace and validate
        run: |
          python - <<'PY'
          import pathlib, subprocess, yaml
          config = yaml.safe_load(pathlib.Path('.github/workflows/review-draft-content-once.yml').read_text())
          steps = {step.get('name'): step['run'] for step in config['jobs']['review']['steps'] if 'run' in step}
          def run(name):
              subprocess.run(['bash','-e','-c',steps[name]],check=True)
          run('Apply only the reviewed content changes')
          changed = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          for name in changed:
              if name.endswith('.html'):
                  p=pathlib.Path(name)
                  p.write_text('\n'.join(line.rstrip() for line in p.read_text().splitlines())+'\n')
          run('Validate and build')
          run('Review desktop and mobile pages')
          run('Commit the validated content only')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: draft-status-browser-review
          path: draft-review
          retention-days: 7
