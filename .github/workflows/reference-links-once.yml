name: Check recorded bibliography links
on:
  push:
    branches: [publication-usability-references-20260901]
    paths: [.github/workflows/reference-links-once.yml]
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check public destinations and recorded metadata
        run: |
          python - <<'PY'
          import concurrent.futures, hashlib, html, json, pathlib, re, time, urllib.request, urllib.error
          url='https://drive.google.com/uc?export=download&id=1S72iN_ZVKqBkLlje-fG3zLAd05nhOyhz'
          raw=urllib.request.urlopen(url,timeout=45).read()
          assert hashlib.sha256(raw).hexdigest()=='d92f9d4bd7e9ac6f8732acc8c2d1ff19f90ba6c709a0bd62ac318defcedafa12'
          urls=json.loads(raw)
          out=pathlib.Path('reference-link-review');out.mkdir()
          def check(url):
              row={'url':url,'checkedAt':'2026-09-01','status':'not_checked','httpStatus':None,'finalUrl':url,'title':'','citationTitle':''}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; AgencyTransferBibliographyReview/1.0)','Accept':'text/html,application/pdf;q=0.8,*/*;q=0.5'})
                  with urllib.request.urlopen(req,timeout=10) as res:
                      row['httpStatus']=res.status;row['finalUrl']=res.url
                      content=res.read(180000)
                      row['status']='reachable'
                      if 'text/html' in res.headers.get('Content-Type',''):
                          text=content.decode('utf-8','replace')
                          m=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
                          row['title']=html.unescape(re.sub(r'<[^>]+>',' ',m.group(1))).strip()[:400] if m else ''
                          for tag in re.findall(r'<meta\s[^>]+>',text,re.I):
                              attrs={a.lower():html.unescape(v) for a,_,v in re.findall(r'([\w:-]+)\s*=\s*([\"\x27])(.*?)\2',tag,re.S)}
                              if (attrs.get('name') or attrs.get('property') or '').lower() in ('citation_title','dc.title','dcterms.title'):
                                  row['citationTitle']=attrs.get('content','')[:500]
                          if re.search(r'access denied|just a moment|attention required|captcha',row['title'],re.I):row['status']='access_limited'
              except urllib.error.HTTPError as e:
                  row['httpStatus']=e.code
                  row['status']='not_found' if e.code in (404,410) else 'access_limited' if e.code in (401,403,429) else 'unavailable'
              except Exception as e:row['status']='unavailable';row['error']=type(e).__name__
              return row
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:results=list(pool.map(check,urls))
          (out/'link-checks.json').write_text(json.dumps(results,indent=2,ensure_ascii=False))
          # DOI bibliographic identity check is distinct from source accessibility.
          dois=[]
          for u in urls:
              m=re.search(r'doi.org/(10\.[^?#]+)',u)
              if m and not m.group(1).startswith('10.48550/'):dois.append(m.group(1))
          def crossref(doi):
              try:
                  req=urllib.request.Request('https://api.crossref.org/works/'+doi,headers={'User-Agent':'AgencyTransferBibliographyReview/1.0'})
                  with urllib.request.urlopen(req,timeout=10) as res:d=json.load(res)['message']
                  return {'doi':doi,'title':d.get('title',[]),'type':d.get('type'),'container':d.get('container-title',[]),'authors':d.get('author',[]),'published':d.get('published',{}),'url':d.get('URL'),'status':'metadata_returned'}
              except Exception as e:return {'doi':doi,'status':'metadata_unavailable','error':type(e).__name__}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:metadata=list(pool.map(crossref,sorted(set(dois))))
          (out/'doi-metadata.json').write_text(json.dumps(metadata,indent=2,ensure_ascii=False))
          counts={s:sum(r['status']==s for r in results) for s in sorted({r['status'] for r in results})}
          print(json.dumps({'urls':len(results),'link_statuses':counts,'doi_records':len(metadata),'note':'HTTP reachability and metadata checks are not evidence appraisal or full-text review.'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-link-review
          path: reference-link-review
          retention-days: 7
