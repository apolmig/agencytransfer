name: Deep web and asset sanitization audit
on:
  push:
    branches: [deep-sanitization-review-20260902]
    paths: [.github/workflows/deep-sanitization-audit-once.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: deep-sanitization-review-20260902
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Generate bounded source and asset audit
        run: |
          python - <<'PY'
          import collections, hashlib, json, mimetypes, pathlib, re, subprocess
          root=pathlib.Path.cwd()
          out=root/'deep-sanitization-audit';out.mkdir()
          tracked=subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          tracked=[pathlib.Path(x.decode()) for x in tracked if x]
          records=[];digests=collections.defaultdict(list)
          for p in tracked:
              if not p.exists() or p.is_dir():continue
              raw=p.read_bytes();sha=hashlib.sha256(raw).hexdigest();digests[sha].append(str(p))
              records.append({'path':str(p),'bytes':len(raw),'sha256':sha,'mime':mimetypes.guess_type(p.name)[0] or 'application/octet-stream'})
          (out/'tracked-files.json').write_text(json.dumps(records,indent=2))
          duplicates=[{'sha256':k,'paths':v,'bytes':next(r['bytes'] for r in records if r['sha256']==k)} for k,v in digests.items() if len(v)>1]
          (out/'duplicate-assets.json').write_text(json.dumps(sorted(duplicates,key=lambda x:-x['bytes']),indent=2))
          text_ext={'.ts','.tsx','.js','.mjs','.json','.md','.html','.css','.csv','.yml','.yaml','.txt','.cff','.py'}
          patterns={
            'credential_like':re.compile(r'(?i)(?:sk-[A-Za-z0-9_-]{20,}|hf_[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|bearer\s+[A-Za-z0-9._-]{20,})'),
            'private_or_local_path':re.compile(r'(?i)(?:file:///|[A-Z]:\\\\|/mnt/data/|/home/oai/|localhost(?::\d+)?|127\.0\.0\.1(?::\d+)?)'),
            'temporary_host':re.compile(r'(?i)(?:oaiusercontent\.com|blob:|data:text/html|raw\.githubusercontent\.com/[^\s\"\']+/(?:tmp|temp)/)'),
            'internal_process_language':re.compile(r'(?i)(?:prompt injection|system prompt|chain of thought|internal scratchpad|tool call|generated by chatgpt|as an ai language model)'),
            'unfinished_marker':re.compile(r'(?i)\b(?:TODO|FIXME|TBD|placeholder|lorem ipsum|coming soon|not yet published|pending asset)\b'),
            'sensitive_operational_term':re.compile(r'(?i)(?:full harmful prompt|campaign-ready|targetable profile|evasion method|credential|live distribution instruction|operator judge trace)'),
          }
          findings=[]
          for p in tracked:
              if p.suffix.lower() not in text_ext or not p.exists():continue
              try:text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              for name,rx in patterns.items():
                  for m in rx.finditer(text):
                      line=text.count('\n',0,m.start())+1
                      excerpt=text[max(0,m.start()-80):m.end()+100].replace('\n',' ')[:260]
                      findings.append({'type':name,'path':str(p),'line':line,'match':m.group(0)[:120],'excerpt':excerpt})
          (out/'content-findings.json').write_text(json.dumps(findings,indent=2,ensure_ascii=False))
          # Inventory built routes and local references.
          html_files=sorted((root/'dist').rglob('*.html'))
          local_refs=[]
          missing=[]
          for p in html_files:
              text=p.read_text(errors='replace')
              for attr,url in re.findall(r'\b(href|src)=[\"\']([^\"\']+)',text,re.I):
                  if url.startswith(('http://','https://','mailto:','tel:','#','data:','blob:')):continue
                  url=url.split('#',1)[0].split('?',1)[0]
                  if not url:continue
                  if url.startswith('/agencytransfer/'):
                      rel=url[len('/agencytransfer/'):]
                      target=root/'dist'/rel
                  elif url.startswith('/'):
                      continue
                  else:target=(p.parent/url).resolve()
                  candidates=[target,target/'index.html']
                  exists=any(c.exists() for c in candidates)
                  local_refs.append({'from':str(p.relative_to(root/'dist')),'attribute':attr,'url':url,'exists':exists})
                  if not exists:missing.append(local_refs[-1])
          (out/'local-references.json').write_text(json.dumps(local_refs,indent=2))
          (out/'missing-local-references.json').write_text(json.dumps(missing,indent=2))
          # External URLs for later identity/reachability review.
          urls=set()
          for p in tracked:
              if p.suffix.lower() not in text_ext or not p.exists():continue
              try:text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:continue
              urls.update(re.findall(r'https?://[^\s\"\'<>`)}\]]+',text))
          (out/'external-urls.json').write_text(json.dumps(sorted(urls),indent=2))
          largest=sorted(records,key=lambda x:-x['bytes'])[:100]
          summary={
            'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'trackedFiles':len(records),'trackedBytes':sum(r['bytes'] for r in records),
            'duplicateGroups':len(duplicates),'contentFindings':collections.Counter(x['type'] for x in findings),
            'builtHtmlFiles':len(html_files),'localReferences':len(local_refs),'missingLocalReferences':len(missing),
            'externalUrls':len(urls),'largestFiles':largest,
            'note':'Pattern matches and link presence checks are triage signals, not findings by themselves.'
          }
          (out/'summary.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          PY
      - name: Record dependency audit without failing the research build
        run: |
          npm audit --json > deep-sanitization-audit/npm-audit.json || true
          npm outdated --json > deep-sanitization-audit/npm-outdated.json || true
      - name: Package current source and built publication
        run: |
          git archive HEAD -o deep-sanitization-audit/source.zip
          tar -czf deep-sanitization-audit/dist.tar.gz dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-sanitization-audit
          path: deep-sanitization-audit
          retention-days: 7
