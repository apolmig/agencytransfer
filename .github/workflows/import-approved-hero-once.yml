name: Import verified hero assets
on:
  push:
    branches: [replace-hero-with-final-cde-illustration]
    paths: [.github/workflows/import-approved-hero-once.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: replace-hero-with-final-cde-illustration
      - name: Retrieve and verify exact approved assets
        run: |
          python - <<'PY'
          import hashlib, io, json, pathlib, urllib.request, zipfile
          url = 'https://drive.usercontent.google.com/download?id=1UE_9ZcUsf42gtcPCd3zJ6-pxGqDYpJy_&export=download&confirm=t'
          request = urllib.request.Request(url, headers={'User-Agent':'AgencyTransfer-asset-import/1.0'})
          raw = urllib.request.urlopen(request, timeout=60).read()
          digest = hashlib.sha256(raw).hexdigest()
          assert len(raw) == 818360 and digest == 'f07ab3ac151395bb2cd592935cdf297e59f978f14aebcb87e7c75fe77031801e', f'Unexpected archive: {len(raw)} bytes, {digest}'
          expected = {
              'cde-gap3-hero-824.webp': '6c7b9122060da0c052aca02343c458a46672fd7d6edee0b224d44879fccaceb6',
              'cde-gap3-hero-1672.webp': '5d41200d1aa40f4e76117cf542166c33905b7ec6343d98ba5718eff2b65f13ae',
              'provenance.json': 'f09ee1acf5273994ce8b9a6c6ba500b76d058f652db82eda8ae339139daa4210',
          }
          dest = pathlib.Path('public/media')
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert set(archive.namelist()) == set(expected), 'Unexpected archive entries'
              for name, checksum in expected.items():
                  data = archive.read(name)
                  assert hashlib.sha256(data).hexdigest() == checksum, f'Checksum mismatch: {name}'
                  target = 'cde-gap3-hero.json' if name == 'provenance.json' else name
                  (dest / target).write_bytes(data)
                  print(target, len(data), checksum)
          source = pathlib.Path('src/editorial/ProgrammePages.tsx')
          text = source.read_text()
          old = '<img src={route("media/cde-rift-hero.webp")} alt="Illustration of the Capability–Deployment–Effect Rift, from model capability and deployment to uncertain behavioural and electoral consequences." />'
          new = '''<img
            src={route("media/cde-gap3-hero-1672.webp")}
            srcSet={`${route("media/cde-gap3-hero-824.webp")} 824w, ${route("media/cde-gap3-hero-1672.webp")} 1672w`}
            sizes="(max-width: 1050px) calc(100vw - 48px), 55vw"
            width={1672}
            height={941}
            loading="eager"
            fetchPriority="high"
            decoding="async"
            style={{ height: "auto" }}
            alt="The Capability–Deployment–Effect Gap: AI capability and deployment are separated from electoral consequences by uncertain links through exposure, attention, beliefs, and intentions."
          />'''
          assert text.count(old) == 1, 'Expected exactly one original hero element'
          source.write_text(text.replace(old, new))
          PY
      - name: Commit only the approved hero replacement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/media/cde-gap3-hero-824.webp public/media/cde-gap3-hero-1672.webp public/media/cde-gap3-hero.json
          git add src/editorial/ProgrammePages.tsx
          git diff --cached --stat
          git commit -m 'Replace hero with the original uploaded illustration and responsive WebP assets'
          git push origin HEAD:replace-hero-with-final-cde-illustration
      - name: Check HTTPS certificate and HTTP behavior
        if: always()
        run: |
          mkdir -p verification
          python - <<'PY'
          import datetime, json, pathlib, socket, ssl, urllib.request
          host = 'miguelguerrero.eu'
          context = ssl.create_default_context()
          with socket.create_connection((host,443),timeout=20) as socket_:
              with context.wrap_socket(socket_,server_hostname=host) as tls:
                  certificate = tls.getpeercert()
                  protocol = tls.version()
          report = {'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'hostname':host,'tls_validated':True,'tls_version':protocol,'certificate':certificate,'responses':[]}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          for scheme in ('https','http'):
              url=f'{scheme}://{host}/agencytransfer/'
              try:
                  response=opener.open(urllib.request.Request(url,method='HEAD'),timeout=20)
              except urllib.error.HTTPError as error:
                  response=error
              report['responses'].append({'url':url,'status':response.status,'location':response.headers.get('Location'),'content_type':response.headers.get('Content-Type')})
          pathlib.Path('verification/https-check.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-import-verification
          path: verification/
          retention-days: 1
