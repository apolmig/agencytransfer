name: Inspect uploaded hero asset
on:
  push:
    branches: [replace-hero-with-final-cde-illustration]
    paths: [.github/workflows/import-approved-hero-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect stored image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inspection
          gh api repos/apolmig/agencytransfer/git/blobs/504ca557b6556f4761bc348bbbe10795e3e6f04c > inspection/blob.json
          python -m pip install --quiet Pillow==11.3.0
          python - <<'PY'
          import base64, hashlib, json, pathlib
          from PIL import Image
          root = pathlib.Path('inspection')
          blob = json.loads((root / 'blob.json').read_text())
          raw = base64.b64decode(blob['content'])
          (root / 'uploaded.webp').write_bytes(raw)
          print('BYTES',len(raw),'SHA256',hashlib.sha256(raw).hexdigest())
          try:
              im=Image.open(root / 'uploaded.webp')
              im.load()
              print('IMAGE',im.size,im.mode)
              im.save(root / 'preview.png')
          except Exception as e:
              print('DECODE ERROR',str(e))
          (root / 'blob.json').unlink()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uploaded-hero-inspection
          path: inspection/
          retention-days: 1
