name: Prepare prepublication edit
on:
  push:
    branches: [prepublication-status-20260903]
    paths: [.github/workflows/prepublication-source-once.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: git archive HEAD -o "$RUNNER_TEMP/prepublication-source.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: prepublication-source
          path: ${{ runner.temp }}/prepublication-source.zip
          retention-days: 3
