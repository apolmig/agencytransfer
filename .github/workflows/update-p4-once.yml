name: Integrate current manuscript and P4 publication
on:
  push:
    branches: [p4-source-linked-web-20260901]
    paths: [.github/workflows/update-p4-once.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p4-source-linked-web-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Integrate the reviewed main-branch manuscript changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          python - <<'PY'
          import copy, json, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git',*args],text=True)
          target='90314d6f0dd66ddbf8ea7d312f859c0c9d548024'
          assert git('rev-parse','origin/main').strip()==target, 'Main changed; review new edits before merging.'
          base='c147a6e4c2bfd1d62e50233503372b8b0a1c6cb1'
          mf='programme/project-manifest.json'
          rf='src/editorial/ResourcePages.tsx'
          old=json.loads(git('show',f'{base}:{mf}'))
          ours=json.loads(pathlib.Path(mf).read_text())
          theirs=json.loads(git('show',f'{target}:{mf}'))
          resource=git('show',f'{target}:{rf}')
          result=subprocess.run(['git','merge','--no-commit','--no-ff',target])
          assert result.returncode in (0,1)
          conflicts=set(git('diff','--name-only','--diff-filter=U').splitlines())
          assert conflicts <= {mf,rf}, conflicts
          merged=copy.deepcopy(theirs)
          for key,value in ours.items():
              if key in ('research_parts','artifacts'):
                  before={x['id']:x for x in old[key]}
                  current={x['id']:x for x in merged[key]}
                  for item in value:
                      if item!=before.get(item['id']): current[item['id']]=item
                  merged[key]=list(current.values())
              elif value!=old.get(key): merged[key]=value
          flagship=next(a for a in merged['artifacts'] if a['id']=='flagship-paper')
          assert flagship['source_version']=='v1.3-20260901'
          assert any(a['id']=='part-iv-source-linked-review' for a in merged['artifacts'])
          pathlib.Path(mf).write_text(json.dumps(merged,indent=2,ensure_ascii=False)+'\n')
          def replace_once(a,b):
              global resource
              assert resource.count(a)==1, ('Unexpected manuscript anchor',a)
              resource=resource.replace(a,b)
          replace_once('Flagship working paper v1.3</p>', 'Flagship working paper v1.3 · Web overview</p>')
          replace_once('How frontier AI can turn political influence into infrastructure—and how democracy can preserve self-correction', 'How frontier AI can turn political influence into infrastructure, and how democracy can be more resilient to the new challenges ahead.')
          replace_once('<p className="v2-paper-byline">Miguel Guerrero · Cambridge · 1 September 2026</p>', '<p className="v2-paper-byline">Miguel Guerrero · Cambridge · 1 September 2026</p><p className="v2-figure-caption">Parts I–III: evidence freeze, 28 August 2026. Part IV: source-linked review, 1 September. All material remains draft and not peer reviewed.</p>')
          replace_once('<a className="v2-button v2-button--dark" href="#abstract">Read the abstract</a>', '<a className="v2-button v2-button--dark" href={route("research/harmful-manipulation-election-security-v1.3-20260901.pdf")}>Read the full working paper · PDF</a>')
          replace_once('Public downloadable manuscript hosting remains separate from this web overview.', 'The full 34-page PDF includes Appendix G and the complete references; this page is a web overview, not the full manuscript.')
          replace_once('<details><summary>Selected source references and claim ceilings</summary>', '<p><TextLink href={route("research/part-iv/")}>Explore the policy findings and complete source record</TextLink></p><details><summary>Selected source references and claim ceilings</summary>')
          replace_once('href={route("research/part-ii/")}>Open Registry', 'href={route("registry/")}>Open Registry')
          replace_once('<article><h2>Agency Transfer Lab</h2>', '<article><h2>Policy source-linked review · 1 September</h2><p>118 implementation dossiers, 69 selected source records and the revised recommendations. A companion assessment, not 118 verified efficacy estimates.</p><div className="v2-card-links"><TextLink href={route("research/part-iv/")}>Read the review</TextLink><TextLink href={route("research/p4-source-linked-review-20260901.xlsx")}>Download workbook</TextLink></div></article><article><h2>Agency Transfer Lab</h2>')
          replace_once('<section className="v2-update-list">', '<section className="v2-update-list"><article><time>1 Sep 2026</time><div><h2>Source-linked policy review and full manuscript published</h2><p>Replaced the current Part IV page with four differentiated recommendation portfolios and six source-linked findings. Published the 118 implementation dossiers, 69-source ledger, original review workbook and full v1.3 working-paper PDF. Historical Atlas beta.3 flags remain unchanged. The hero and complete Registry are preserved.</p></div></article>')
          assert 'const policySources = [' in resource and 'function PolicyPaperEvidence()' in resource
          pathlib.Path(rf).write_text(resource.rstrip()+'\n')
          subprocess.run(['git','add',mf,rf],check=True)
          assert not git('diff','--name-only','--diff-filter=U').strip()
          print('Concurrent manuscript analysis and references preserved; PDF and review access added.')
          PY
      - name: Validate integrated publication
        run: |
          npm ci
          npm run build
          git diff --check --cached
          test -f dist/research/p4-source-linked-review-20260901.xlsx
          test -f dist/research/harmful-manipulation-election-security-v1.3-20260901.pdf
      - name: Commit the integrated result
        run: |
          git commit -m 'Integrate the current v1.3 manuscript without discarding its policy analysis'
          git push origin HEAD:p4-source-linked-web-20260901
