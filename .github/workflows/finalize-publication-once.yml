name: Final publication usability check
on:
  push:
    branches: [publication-usability-references-20260901]
    paths: [.github/workflows/finalize-publication-once.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: publication-usability-references-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Align metadata and shorten the reference introduction
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('.')
          p=root/'programme/project-manifest.json';d=json.loads(p.read_text())
          f=next(x for x in d['artifacts'] if x['id']=='flagship-paper')
          assert f['source_version']=='v1.5-20260901'
          f['source_url']='https://miguelguerrero.eu/agencytransfer/research/harmful-manipulation-election-security-v1.5-20260901.pdf'
          f['repo_path']='public/research/harmful-manipulation-election-security-v1.5-20260901.pdf'
          d['research_parts'][0]['question']='How far can an adversarial actor go with $10?'
          d['routes']['primary_navigation']=[{'label':label,'path':path} for label,path in [('Programme','/'),('Research','/research/'),('Registry','/registry/'),('References','/references/'),('Artifacts','/outputs/'),('About','/about/')]]
          for path in ('/registry/','/registry/evidence/','/registry/testing/'):
              if path not in d['routes']['canonical_routes']:d['routes']['canonical_routes'].append(path)
          for x in d['routes']['redirects']:
              if x['from']=='/evidence/':x['to']='/registry/evidence/'
              if x['from']=='/testing/':x['to']='/registry/testing/'
          p.write_text(json.dumps(d,indent=2,ensure_ascii=False)+'\n')
          p=root/'src/editorial/ReferencesPage.tsx';s=p.read_text()
          old='The flagship bibliography and the wider sources reviewed, registered or considered across the programme. Inclusion is not endorsement, independent verification or proof of an effect.'
          new='The flagship bibliography and the wider reading behind the programme. Search by author, title or subject. Review depth varies; inclusion is not endorsement.'
          assert s.count(old)==1;s=s.replace(old,new)
          old='<p className="reference-scope">Manuscript v{library?.manuscriptVersion ?? "1.5"} · Source snapshot: 1 September 2026. {library?.scopeNote}</p>'
          new='<p className="reference-scope">Manuscript v{library?.manuscriptVersion ?? "1.5"} · Source snapshot: 1 September 2026.</p>'
          assert s.count(old)==1;s=s.replace(old,new)
          download='<div className="reference-downloads"><a href={route("research/references.html")} target="_blank" rel="noopener noreferrer">Read the full bibliography</a><a href={route("research/references.json")} download>Download source index · JSON</a></div>'
          assert s.count(download)==1;s=s.replace(download,'')
          marker='    {error ? <p role="alert">{error}</p> : null}'
          assert s.count(marker)==1;s=s.replace(marker,'    '+download+'\n'+marker)
          marker='<details className="reference-method"><summary>What is included, and how duplicates are handled</summary>'
          assert s.count(marker)==1;s=s.replace(marker,marker+'<p>{library.scopeNote}</p>')
          p.write_text('\n'.join(line.rstrip() for line in s.splitlines())+'\n')
          p=root/'src/editorial/publication-polish.css'
          with p.open('a') as f:f.write('\n.v2-site .references-page .v2-page-lead{padding-top:44px;padding-bottom:26px}.v2-site .references-page .v2-page-lead h1{font-size:clamp(1.9rem,3.4vw,2.7rem)}.v2-site .references-page .v2-page-lead .v2-deck{font-size:1.05rem;max-width:820px;line-height:1.6}.v2-site .references-page .reference-scope{margin:0 0 22px}.v2-site .references-page .reference-downloads{margin:18px 0;font-size:.84rem}.v2-site .references-page .reference-count{margin:18px 0}\n')
          p=root/'scripts/validate-publication.py';s=p.read_text()
          s=s.replace("assert len(data['records'])==data['counts']['records']==431", "assert len(data['records'])==data['counts']['records'] and len(data['records'])>0")
          s=s.replace("assert sum(len(r['citations']) for r in data['records'])==64", "assert sum(len(r['citations']) for r in data['records'])==data['counts']['flagshipCitations']")
          s=s.replace("assert sum(len(r['provenance']) for r in data['records'])==610", "assert sum(len(r['provenance']) for r in data['records'])==data['counts']['sourceEntries']")
          s=s.replace("print('Publication record validated: 431 references, 64 flagship citations, 610 original entries; exact v1.5 PDF.')", "print(f\"Publication record validated: {data['counts']['records']} references, {data['counts']['flagshipCitations']} flagship citations, {data['counts']['sourceEntries']} original entries; exact v1.5 PDF.\")")
          p.write_text(s)
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)=={'programme/project-manifest.json','src/editorial/ReferencesPage.tsx','src/editorial/publication-polish.css','scripts/validate-publication.py'},changed
          PY
      - name: Validate
        run: |
          npm ci
          python scripts/build-reference-page.py
          python scripts/validate-publication.py
          npm run build
          git diff --check
          git diff --exit-code origin/main -- src/LegacyRegistryApp.tsx src/components/FrontierTimeline.tsx src/components/LiteratureReview.tsx src/styles.css src/editorial/research-updates.css public/data data
      - name: Review in Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python scripts/review-publication.py
      - name: Remove staging workflows and commit the reviewed result
        run: |
          git add programme/project-manifest.json src/editorial/ReferencesPage.tsx src/editorial/publication-polish.css scripts/validate-publication.py
          git rm .github/workflows/publication-review-once.yml .github/workflows/reference-links-once.yml .github/workflows/apply-publication-once.yml .github/workflows/finalize-publication-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align manuscript metadata and finish the compact references interface'
          git push origin HEAD:publication-usability-references-20260901
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-browser-review
          path: publication-browser-review
          retention-days: 7
