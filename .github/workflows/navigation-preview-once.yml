name: Prepare navigation review
on:
  push:
    branches: [simple-navigation-scope-20260901]
    paths: [.github/workflows/navigation-preview-once.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: simple-navigation-scope-20260901
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare the exact source and local build runtime
        run: |
          mkdir -p "$RUNNER_TEMP/navigation-source"
          git archive HEAD -o "$RUNNER_TEMP/navigation-source/source.zip"
          cp "$(command -v node)" "$RUNNER_TEMP/navigation-source/node24"
      - uses: actions/upload-artifact@v4
        with:
          name: navigation-source
          path: ${{ runner.temp }}/navigation-source
          retention-days: 3
