name: Capture OpenRouter route evidence

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Route set to capture
        required: true
        type: choice
        default: diselect-v05
        options:
          - diselect-v05
          - ape-stage2a-v01

permissions:
  contents: read

concurrency:
  group: capture-openrouter-routes
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Capture public route evidence
        env:
          CAPTURE_DIR: ${{ runner.temp }}/openrouter-route-evidence
          CAPTURE_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          test ! -e "$CAPTURE_DIR"
          python scripts/capture_openrouter_routes.py \
            --profile "$CAPTURE_PROFILE" \
            --output-dir "$CAPTURE_DIR"
          case "$CAPTURE_PROFILE" in
            diselect-v05) expected=3 ;;
            ape-stage2a-v01) expected=5 ;;
            *) exit 1 ;;
          esac
          test "$(find "$CAPTURE_DIR" -maxdepth 1 -type f -name '*.json' | wc -l)" -eq "$expected"
          test -d "$CAPTURE_DIR/provider-responses"

      - name: Upload public route evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openrouter-route-evidence-${{ inputs.profile }}-${{ github.run_id }}
          path: ${{ runner.temp }}/openrouter-route-evidence
          if-no-files-found: error
          retention-days: 14
