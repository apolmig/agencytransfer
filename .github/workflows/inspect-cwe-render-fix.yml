name: Verify final Inspect Viz rendering
on:
  push:
    branches: [research/inspect-hackathon-20260905]
    paths: ['.github/workflows/inspect-cwe-render-fix.yml']
permissions:
  contents: read
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Install Inspect Viz and browser
        run: |
          python -m pip install inspect-ai==0.3.263 inspect-evals==0.19.0 inspect-viz==0.4.1 pandas python-pptx nbformat nbclient nbconvert ipykernel playwright pytest
          python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: inspect-cwe-complete-submission
          path: submission
          run-id: 33961747762
          github-token: ${{ github.token }}
      - name: Repair the unsupported renderer attributes without altering data
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('submission/analysis.py');s=p.read_text()
          old=",aria_label='Accurate benign reports, inflated tool calls, and locally accepted inflation for two small Qwen models',aria_description='24 records per condition per model. Capability is measured on separate benign requests; only calls and accepted inflation share the same samples. The willingness proxy does not establish intent.'"
          assert old in s
          p.write_text(s.replace(old,''))
          p=Path('submission/build_notebook.py');s=p.read_text()
          s=s.replace("assert dimensions,'Inspect Viz PNG export failed'","assert dimensions and dimensions[0]>=2200 and dimensions[1]>=750, 'Inspect Viz PNG export failed or rendered an error panel'")
          p.write_text(s)
          Path('submission/provenance/render-repair.txt').write_text('Inspect Viz 0.4.1 Python accepted aria_label/aria_description but its bundled renderer rejected ariaLabel. Removed those two non-data plot attributes. All observations, scores and plotted coordinates unchanged. PNG dimensions and browser DOM now checked explicitly.\n')
          PY
      - name: Execute notebook and reject browser error panels
        run: |
          cd submission
          python -u build_notebook.py
          python - <<'PY'
          from pathlib import Path
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1400,'height':800})
              page.goto((Path('outputs/inspect_viz_plot.html').resolve()).as_uri(),wait_until='networkidle')
              page.wait_for_timeout(1200)
              body=page.inner_text('body')
              print('PLOT_DOM_TEXT',body[:2500])
              assert 'Unrecognized' not in body and 'Stack Trace' not in body,body
              sizes=page.locator('svg').evaluate_all('(els)=>els.map(e=>({w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height}))')
              assert any(x['w']>=1100 and x['h']>=350 for x in sizes),sizes
              marks=page.locator('svg circle,svg path').count()
              assert marks>=6,marks
              Path('outputs/browser-render-validation.json').write_text(json.dumps({'status':'PASS','svg_sizes':sizes,'mark_count':marks,'visible_text':body},indent=2))
              browser.close()
          PY
          python -m jupyter nbconvert --to html capability_willingness_execution.ipynb --output capability_willingness_execution.html
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil
          for p in list(Path('.').rglob('__pycache__')): shutil.rmtree(p)
          manifest={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('.').rglob('*') if p.is_file() and p.name!='SHA256SUMS.json'}
          Path('SHA256SUMS.json').write_text(json.dumps(manifest,indent=2))
          print('RENDER_AND_NOTEBOOK_CHECKED')
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: inspect-cwe-verified-submission
          path: submission/
          retention-days: 14
          if-no-files-found: error
