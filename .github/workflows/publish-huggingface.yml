name: Publish aggregated dataset to Hugging Face

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "huggingface/**"
      - "data/published/**"
      - "data/models/**"
      - "data/runs/2026-08-10-ape-frontier-pilot-v01/**"
      - "public/data/frontier-*.json"
      - "public/data/testing-notes.json"
      - "public/data/model-manifest.json"
      - "data/PROVENANCE.md"
      - "LICENSES/DATA.md"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HF_DATASET_ID: apol/agency-transfer-benchmark
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate public artifacts
        run: |
          npm ci
          npm run validate:data
          npm run test:runner
      - name: Require a write-scoped Hub token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Add a write-scoped HF_TOKEN repository secret before running this workflow."
            exit 1
          fi
      - name: Install the Hugging Face CLI
        run: python -m pip install --upgrade "huggingface_hub>=1.0,<2"
      - name: Stage the public release
        run: |
          mkdir -p hf-release
          cp huggingface/README.md hf-release/README.md
          cp data/published/anthropic-agentic-influence.csv hf-release/
          cp data/published/diselect-summary.csv hf-release/
          cp data/published/mask-original-results.csv hf-release/
          cp data/published/infoopsbench-2026-07-26.csv hf-release/
          cp data/published/saferai-glm52-ape-mask.csv hf-release/
          cp public/data/model-manifest.json hf-release/model-manifest.json
          cp public/data/frontier-models.json hf-release/frontier-models.json
          cp data/models/frontier-models.csv hf-release/frontier-models.csv
          cp public/data/frontier-observations.json hf-release/frontier-observations.json
          cp public/data/testing-notes.json hf-release/testing-notes.json
          mkdir -p hf-release/runs/2026-08-10-ape-frontier-pilot-v01
          cp data/runs/2026-08-10-ape-frontier-pilot-v01/aggregate.csv hf-release/runs/2026-08-10-ape-frontier-pilot-v01/
          cp data/runs/2026-08-10-ape-frontier-pilot-v01/labels.json hf-release/runs/2026-08-10-ape-frontier-pilot-v01/
          cp data/runs/2026-08-10-ape-frontier-pilot-v01/manifest.json hf-release/runs/2026-08-10-ape-frontier-pilot-v01/
          cp data/runs/2026-08-10-ape-frontier-pilot-v01/README.md hf-release/runs/2026-08-10-ape-frontier-pilot-v01/
          cp data/runs/2026-08-10-ape-frontier-pilot-v01/research-notes.json hf-release/runs/2026-08-10-ape-frontier-pilot-v01/
          cp data/runs/2026-08-10-ape-frontier-pilot-v01/route-integrity.json hf-release/runs/2026-08-10-ape-frontier-pilot-v01/
          cp data/runs/2026-08-10-ape-frontier-pilot-v01/validation.json hf-release/runs/2026-08-10-ape-frontier-pilot-v01/
          cp data/PROVENANCE.md hf-release/PROVENANCE.md
          cp LICENSES/DATA.md hf-release/DATA_LICENSE.md
      - name: Create or update the dataset repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf repos create "$HF_DATASET_ID" --type dataset --exist-ok
          hf upload "$HF_DATASET_ID" hf-release . \
            --type dataset \
            --commit-message "Publish Agency Transfer Benchmark frontier draft 0.2"
