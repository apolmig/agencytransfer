name: Publish aggregated dataset to Hugging Face

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_ID: apol/agency-transfer-benchmark
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Require a write-scoped Hub token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "Add a write-scoped HF_TOKEN repository secret before running this workflow."
            exit 1
          fi
      - name: Install the Hugging Face CLI
        run: python -m pip install --upgrade "huggingface_hub>=1.0,<2"
      - name: Stage the public release
        run: |
          mkdir -p hf-release
          cp huggingface/README.md hf-release/README.md
          cp data/published/anthropic-agentic-influence.csv hf-release/
          cp data/published/diselect-summary.csv hf-release/
          cp data/published/mask-original-results.csv hf-release/
          cp public/data/model-manifest.json hf-release/model-manifest.json
          cp data/PROVENANCE.md hf-release/PROVENANCE.md
          cp LICENSES/DATA.md hf-release/DATA_LICENSE.md
      - name: Create or update the dataset repository
        run: |
          hf repos create "$HF_DATASET_ID" --type dataset --exist-ok
          hf upload "$HF_DATASET_ID" hf-release . \
            --type dataset \
            --commit-message "Publish Agency Transfer Benchmark Wave 0"
