name: Verify published P4 content
on:
  push:
    branches: [p4-source-linked-web-20260901]
    paths: [.github/workflows/review-p4-once.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: p4-source-linked-web-20260901
      - name: Install browser test tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Check live pages and publication files
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, time, urllib.request
          from playwright.sync_api import sync_playwright
          base = 'https://miguelguerrero.eu/agencytransfer/'
          out = pathlib.Path('p4-browser-review')
          out.mkdir()
          report = {'mode':'live','base':base,'pages':[],'files':[],'legacy_layout_notes':[]}
          try:
              with sync_playwright() as p:
                  browser = p.chromium.launch()
                  for width in (1440,390):
                      context = browser.new_context(viewport={'width':width,'height':1000 if width==1440 else 844})
                      page = context.new_page()
                      errors = []
                      page.on('pageerror', lambda e: errors.append(str(e)))
                      for slug in ('','research/part-iv/','paper/','outputs/','registry/','registry/evidence/','registry/testing/'):
                          response = page.goto(base+slug, wait_until='networkidle', timeout=30000)
                          assert response.status == 200, (slug,response.status)
                          page.locator('h1').first.wait_for()
                          sw = page.evaluate('document.documentElement.scrollWidth')
                          overflow = sw > width + 1
                          if overflow:
                              assert slug == 'registry/evidence/' and width == 390 and sw <= 696, (slug,width,sw)
                              report['legacy_layout_notes'].append({'path':slug,'viewport':width,'scroll_width':sw,'note':'Unchanged from the pre-update production baseline.'})
                          if slug == '':
                              cards = page.locator('.v2-parts--simple .v2-part-card')
                              assert cards.count() == 4
                              assert all(c.locator('a').count() == 1 for c in cards.all())
                              assert cards.nth(1).locator('a').get_attribute('href') == '/agencytransfer/registry/'
                              image = page.locator('.v2-hero-art img')
                              assert 'cde-gap3-hero-' in image.get_attribute('src')
                              assert image.evaluate('(el) => el.complete && el.naturalWidth > 0')
                              assert 'Working draft' in page.locator('.v2-draftbar').inner_text()
                          if slug == 'research/part-iv/':
                              assert page.locator('h1').inner_text() == 'What works—and for whom?'
                              assert page.locator('.p4-portfolios article').count() == 4
                              assert page.locator('.p4-findings details').count() == 6
                              page.locator('.p4-findings summary').first.click()
                              assert page.locator('.p4-findings details').first.get_attribute('open') is not None
                              page.locator('.p4-findings summary').first.click()
                          if slug == 'paper/':
                              assert 'v1.3' in page.locator('main').inner_text()
                              assert page.locator('a[href$="v1.3-20260901.pdf"]').count() == 1
                              assert 'Security must name its beneficiary' in page.locator('main').inner_text()
                          if slug in ('','research/part-iv/','paper/'):
                              page.evaluate("document.documentElement.style.scrollBehavior='auto'; if(document.activeElement instanceof HTMLElement) document.activeElement.blur(); window.scrollTo(0,0)")
                              page.wait_for_timeout(150)
                              name = (slug or 'home').strip('/').replace('/','-')
                              page.screenshot(path=str(out/f'{name}-{width}.png'), full_page=True)
                          report['pages'].append({'path':slug,'width':width,'status':response.status,'h1':page.locator('h1').first.inner_text(),'horizontal_overflow':overflow})
                      assert not errors, errors
                      context.close()
                  browser.close()
              files = {
                  'media/cde-gap3-hero-1672.webp':'5d41200d1aa40f4e76117cf542166c33905b7ec6343d98ba5718eff2b65f13ae',
                  'research/p4-source-linked-review-20260901.xlsx':'2104cb1851d5661ddacd0ae0b616e11a9c8ed6ef904d988d1ff7a305f9cdc421',
                  'research/harmful-manipulation-election-security-v1.3-20260901.pdf':'9049528ada708e9c5d591fac2343ef53d89a86d5e1d2703d22b1ef84bf701c5e',
              }
              for path, expected in files.items():
                  with urllib.request.urlopen(base+path, timeout=45) as response:
                      raw = response.read()
                      status = response.status
                  digest = hashlib.sha256(raw).hexdigest()
                  assert status == 200 and digest == expected, (path,status,digest)
                  report['files'].append({'path':path,'status':status,'bytes':len(raw),'sha256':digest})
              report['result'] = 'pass'
          finally:
              (out/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p4-browser-review
          path: p4-browser-review
          retention-days: 7
