name: Apply and review publication usability
on:
  push:
    branches: [publication-usability-references-20260901]
    paths: [.github/workflows/apply-publication-once.yml]
permissions:
  contents: write
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: publication-usability-references-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Apply the fixed public-content package
        run: |
          python - <<'PY'
          import hashlib,io,json,pathlib,subprocess,urllib.request,zipfile
          root=pathlib.Path.cwd()
          url='https://drive.google.com/uc?export=download&id=1ZtPP6lghTpLF82_1UcpCZ4DSVa1vEkiX'
          raw=urllib.request.urlopen(url,timeout=60).read()
          assert len(raw)==1294842
          assert hashlib.sha256(raw).hexdigest()=='be30408b2bda63146d5838b79e5fcc158caa6da5f64344646463bf5104303743'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              m=json.loads(z.read('publication-patch.json'))
              assert len(m['files'])==31
              assert subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()==m['base'],'Main changed; inspect before applying.'
              allowed={x['path'] for x in m['files']}
              assert set(z.namelist())==allowed|{'publication-patch.json'}
              for f in m['files']:
                  path=pathlib.PurePosixPath(f['path'])
                  assert not path.is_absolute() and '..' not in path.parts and '.github' not in path.parts
                  assert not f['path'].startswith(('evals/','data/','src/LegacyRegistry','src/styles','public/data/'))
                  dest=root/path
                  if f['oldSha256'] is None:assert not dest.exists(),f['path']
                  else:assert hashlib.sha256(dest.read_bytes()).hexdigest()==f['oldSha256'],f['path']
                  content=z.read(f['path'])
                  assert len(content)==f['bytes'] and hashlib.sha256(content).hexdigest()==f['sha256']
              for f in m['files']:
                  dest=root/f['path'];dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(z.read(f['path']))
              (root/'publication-patch.json').write_text(json.dumps(m))
          print('Applied 31 exact public files; no Registry code or empirical dataset changes.')
          PY
      - name: Build and validate publication
        run: |
          npm ci
          python scripts/build-reference-page.py
          python scripts/validate-publication.py
          npm run build
          git diff --check
          test -f dist/references/index.html
          git diff --exit-code origin/main -- src/LegacyRegistryApp.tsx src/components/FrontierTimeline.tsx src/components/LiteratureReview.tsx src/styles.css src/editorial/research-updates.css public/data data
      - name: Install browser test tools
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Test readable publication, references and animation
        run: python scripts/review-publication.py
      - name: Commit only the reviewed publication files
        run: |
          python - <<'PY'
          import json,subprocess
          m=json.load(open('publication-patch.json'))
          subprocess.run(['git','add','--',*[x['path'] for x in m['files']]],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Rebuild the explainer, publish the references library and simplify research navigation'
          git push origin HEAD:publication-usability-references-20260901
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-browser-review
          path: publication-browser-review
          retention-days: 7
